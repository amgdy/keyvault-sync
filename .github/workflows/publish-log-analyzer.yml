name: Publish log analyzer

on:
  push:
    branches:
      - main
    paths:
      - tools/keyvaultsync-log-analyzer.html
      - .github/workflows/publish-log-analyzer.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Build static artifact
        run: |
          mkdir _site
          cp tools/keyvaultsync-log-analyzer.html _site/index.html
          cp tools/keyvaultsync-log-analyzer.html _site/keyvaultsync-log-analyzer.html
          touch _site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
