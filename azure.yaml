name: keyvaultsync
metadata:
  template: azd-init@1.17.0
hooks:
  preprovision:
    posix:
      shell: sh
      run: bash ./scripts/prepare-deployment.sh provision
      interactive: true
    windows:
      shell: pwsh
      run: ./scripts/Prepare-Deployment.ps1 provision
      interactive: true
  predeploy:
    posix:
      shell: sh
      run: bash ./scripts/prepare-deployment.sh deploy
      interactive: true
    windows:
      shell: pwsh
      run: ./scripts/Prepare-Deployment.ps1 deploy
      interactive: true
  postdeploy:
    posix:
      shell: sh
      run: bash ./scripts/postdeploy-keyvault-access.sh
      interactive: true
    windows:
      shell: pwsh
      run: ./scripts/PostDeploy-KeyVaultAccess.ps1
      interactive: true
services:
  keyvaultsync:
    project: ./src/KeyVaultSync.Function
    language: dotnet
    host: function
infra:
  provider: bicep
  path: ./infra
